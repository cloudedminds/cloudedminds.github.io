name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A3A8F0: ${{ secrets.A3A8F0 }}
          B9ADCC: ${{ secrets.B9ADCC }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A3A8F0', '')
          sec_b = os.environ.get('B9ADCC', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- b1c03b58e065e826624fce422d956baf2804 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- fd87cdf50a8a079ef9d542add6c992e803 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
